version: '3.7'
services:
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ./data/redis:/data:Z
    entrypoint: redis-server --appendonly yes
  postgresdb:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/initdb.d:/docker-entrypoint-initdb.d:Z
      - ./data/postgres:/var/lib/postgresql/data:Z
  celery:
    image: c2dhunilu/miller-v2:${MILLER_TAG}
    restart: always
    environment:
       DEBUG: ${DEBUG}
       LANGUAGES: ${LANGUAGES}
       MILLER_DATABASE_NAME: ${POSTGRES_DB}
       MILLER_DATABASE_USER: ${POSTGRES_USER}
       MILLER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
       MILLER_DATABASE_HOST: postgresdb
       MILLER_DATABASE_PORT: 5432
       MILLER_SCHEMA_ROOT: ${MILLER_SCHEMA_ROOT}
       REDIS_HOST: redis
       REDIS_PORT: 6379
       STATIC_URL: ${STATIC_URL}
    depends_on:
      - miller
    entrypoint: celery -A miller worker -l info
    volumes:
      - ./.env:/miller/.env
      - ./data/media:/media
      - ./data/private:/private
      - ./data/contents:/contents
      - miller-static-files:/static
  miller:
    image: c2dhunilu/miller-v2:${MILLER_TAG}
    restart: always
    environment:
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      LANGUAGES: ${LANGUAGES}
      MILLER_DATABASE_NAME: ${POSTGRES_DB}
      MILLER_DATABASE_USER: ${POSTGRES_USER}
      MILLER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      MILLER_DATABASE_HOST: postgresdb
      MILLER_DATABASE_PORT: 5432
      MILLER_SCHEMA_ROOT: ${MILLER_SCHEMA_ROOT}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STATIC_URL: ${STATIC_URL}
      GOOGLE_SPREADHSEEET_ID: ${GOOGLE_SPREADHSEEET_ID}
      GOOGLE_SPREADHSEEET_SERVICE_ACCOUNT_KEY: ${GOOGLE_SPREADHSEEET_SERVICE_ACCOUNT_KEY}
    depends_on:
      - redis
      - postgresdb
    #  - celery
    # entrypoint: gunicorn miller.wsgi:application --bind 0.0.0.0:8000
    entrypoint: >
      /bin/sh -c "PYTHONPATH=/ python miller/dbconnection.py &&
        python manage.py init_git &&
        python manage.py collectstatic --clear --no-input &&
        python manage.py migrate &&
        gunicorn --bind=0.0.0.0:8000 -w 2 -k gthread miller.wsgi"
    # python manage.py runserver 0.0.0.0:8000"
    # gunicorn -b 0.0.0.0:8000 —workers=2 —threads=4 —worker-class=gthread miller.wsgi:application"
    # ports:
    #   - 8008:8000
    volumes:
      - ./.env:/miller/.env
      - ./data/media:/media:z
      - ./data/private:/private:z
      - ./data/contents:/contents:z
      - miller-static-files:/static
  nginx:
    image: nginx:1.17-alpine
    restart: always
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - miller
      - celery
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx.htpasswd:/etc/nginx/conf.d/nginx.htpasswd
      - ./data/media:/opt/media
      - ./data/nginx/html:/opt/html:z
      - ./data/nginx/cache:/opt/cache:z
      - miller-static-files:/opt/static
volumes:
  miller-static-files:
