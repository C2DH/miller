# this dockercompose file only enable the database and redis, ready to be used along pipenc
version: '3.7'
services:
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ./data/redis:/data:z
    entrypoint: redis-server --appendonly yes
    ports:
      - '6379:6379'
  postgresdb:
    image: postgres:14
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${MILLER_DATABASE_USER}
      POSTGRES_DB: ${MILLER_DATABASE_NAME}
      POSTGRES_PASSWORD: ${MILLER_DATABASE_PASSWORD}
    volumes:
      - ./data/initdb.d:/docker-entrypoint-initdb.d:Z
      - ./data/postgres:/var/lib/postgresql/data:Z
