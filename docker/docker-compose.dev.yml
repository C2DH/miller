version: '3.7'
services:
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ./data/redis:/data:z
    entrypoint: redis-server --appendonly yes
    ports:
      - '63790:6379'
  postgresdb:
    image: postgres:14
    ports:
      - '54320:5432'
    environment:
      POSTGRES_USER: ${MILLER_DATABASE_USER}
      POSTGRES_DB: ${MILLER_DATABASE_NAME}
      POSTGRES_PASSWORD: ${MILLER_DATABASE_PASSWORD}
    volumes:
      - ./data/initdb.d:/docker-entrypoint-initdb.d:Z
      - ./data/postgres:/var/lib/postgresql/data:Z
  celery:
    build: .. # miller directory
    # image: c2dhunilu/miller-v2:${MILLER_TAG}
    restart: always
    environment:
      DEBUG: ${DEBUG}
      LANGUAGES: ${LANGUAGES}
      MILLER_DATABASE_NAME: ${MILLER_DATABASE_NAME}
      MILLER_DATABASE_USER: ${MILLER_DATABASE_USER}
      MILLER_DATABASE_PASSWORD: ${MILLER_DATABASE_PASSWORD}
      MILLER_DATABASE_HOST: postgresdb
      MILLER_DATABASE_PORT: 5432
      MILLER_SCHEMA_ROOT: ${MILLER_SCHEMA_ROOT}
      MILLER_GIT_TAG: ${GIT_TAG}
      MILLER_GIT_BRANCH: ${GIT_BRANCH}
      MILLER_GIT_REVISION: ${GIT_REVISION}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - miller
    # volumes:
    #  - ./config/impresso-user-admin.env:/impresso-user-admin/.docker.env
    entrypoint: celery -A miller worker -l info
    # entrypoint: watchmedo auto-restart --directory="/miller" --pattern="*.py" --recursive celery -A miller worker -l info
    volumes:
      - ../:/miller
      - ./data/media:/media:z
      - ./data/private:/private:z
      - ./data/contents:/contents:z
  miller:
    build: .. # miller directory
    # image: c2dhunilu/miller-v2:${MILLER_TAG}
    restart: always
    environment:
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      LANGUAGES: ${LANGUAGES}
      STATIC_URL: ${STATIC_URL}
      MILLER_DATABASE_NAME: ${MILLER_DATABASE_NAME}
      MILLER_DATABASE_USER: ${MILLER_DATABASE_USER}
      MILLER_DATABASE_PASSWORD: ${MILLER_DATABASE_PASSWORD}
      MILLER_DATABASE_HOST: postgresdb
      MILLER_DATABASE_PORT: 5432
      MILLER_SCHEMA_ROOT: ${MILLER_SCHEMA_ROOT}
      MILLER_SIZES_SNAPSHOT_PREVIEW: ${MILLER_SIZES_SNAPSHOT_PREVIEW}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MILLER_GIT_TAG: ${GIT_TAG}
      MILLER_GIT_BRANCH: ${GIT_BRANCH}
      MILLER_GIT_REVISION: ${GIT_REVISION}
      GOOGLE_SPREADHSEEET_ID: ${GOOGLE_SPREADHSEEET_ID}
      GOOGLE_SPREADHSEEET_SERVICE_ACCOUNT_KEY: ${GOOGLE_SPREADHSEEET_SERVICE_ACCOUNT_KEY}
    depends_on:
      - redis
      - postgresdb
    entrypoint:
      - '/bin/sh'
      - -c
      - |
        PYTHONPATH=/ python miller/dbconnection.py \
        && python manage.py migrate \
        && watchmedo auto-restart --recursive --patterns="*.py;*.json;*.js;*.html" --directory="/miller" -- /bin/sh -i miller/docker-compose-dev.entrypoint.sh
    # ports:
    #   - 8008:8000
    volumes:
      - ../:/miller
      - ./data/media:/media:z
      - ./data/private:/private:z
      - ./data/contents:/contents:z
      - miller-static-files:/static
  nginx:
    restart: always
    image: nginx:1.17-alpine
    ports:
      - '${NGINX_PORT}:80'
    depends_on:
      - miller
      - celery
    volumes:
      - ./nginx.htpasswd:/etc/nginx/conf.d/nginx.htpasswd
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/media:/opt/media:z
      - ./data/nginx/html:/opt/html:z
      - ./data/nginx/cache:/opt/cache:z
      - miller-static-files:/opt/static
volumes:
  miller-static-files:
